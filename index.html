<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutina</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rutina">
<meta name="theme-color" content="#0c0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:600 700;font-display:swap;src:url(bsd-700.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:800;font-display:swap;src:url(bsd-800.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:400 500;font-display:swap;src:url(figtree-400.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-display:swap;src:url(figtree-600.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;font-display:swap;src:url(figtree-700.woff2) format("woff2")}

/* Layout: app de una columna para teléfono. Barra de 4 pestañas fija abajo, cronómetro de descanso flotando sobre ella. Titulares en condensada industrial, números grandes y tabulares; el naranja solo marca lo que se toca o lo que toca hoy. */
:root{
  --bg:#f0f1f4;
  --surface:#ffffff;
  --raised:#e6e9ee;
  --ink:#11141a;
  --muted:#5c6472;
  --line:#d8dce3;
  --accent:#e2470d;
  --accent-ink:#ffffff;
  --good:#14784a;
  --warn:#9a5c06;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f14;--surface:#161a21;--raised:#212731;--ink:#f2f4f7;--muted:#98a1b0;--line:#2a313d;
    --accent:#ff6a2b;--accent-ink:#170903;--good:#4ccb8b;--warn:#f0b24a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f14;--surface:#161a21;--raised:#212731;--ink:#f2f4f7;--muted:#98a1b0;--line:#2a313d;
  --accent:#ff6a2b;--accent-ink:#170903;--good:#4ccb8b;--warn:#f0b24a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:18px 16px 190px;display:flex;flex-direction:column;gap:16px}

/* Encabezado */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:.95;margin:4px 0 0;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin-top:8px;font-variant-numeric:tabular-nums}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hint{font-size:13px;color:var(--muted)}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day .d{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.day .t{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.1}
.day.today .d{color:var(--accent)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] .t,.day[aria-pressed="true"].today .d{color:var(--bg)}

/* Progreso de sesión */
.segs{display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--raised)}
.segs i.on{background:var(--accent)}
.focus{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px}
.focus b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}

/* Tarjetas de ejercicio */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card.open{border-color:var(--ink)}
.card.done{border-color:var(--good)}
.chead{width:100%;background:none;border:0;padding:14px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left}
.idx{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.card.done .idx{color:var(--good)}
.cname{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05;text-wrap:balance}
.cmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-radius:6px;padding:2px 6px;background:var(--raised);color:var(--ink)}
.badge.manc{background:var(--ink);color:var(--bg)}
.count{font-family:var(--display);font-weight:700;font-size:20px;min-width:44px;height:44px;border-radius:22px;border:2px solid var(--line);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.card.done .count{background:var(--good);border-color:var(--good);color:#fff}
.cbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.plan{border-radius:12px;background:var(--raised);padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.plan .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.plan .go{font-weight:600}
.plan .go.up{color:var(--good)}
.plan .go.hold{color:var(--warn)}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 48px;gap:8px;align-items:end}
.set.one{grid-template-columns:22px 1fr 48px}
.set.three{grid-template-columns:1fr 1fr 1fr 48px}
.set .n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);padding-bottom:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.inp{width:100%;font:inherit;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.field input::placeholder,.inp::placeholder{color:var(--muted);font-weight:500;opacity:.75}
.ok{width:48px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.ok svg{width:20px;height:20px}
.ok[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.set.miss input.need{border-color:var(--accent)}
.how{font-size:14.5px}
.how .k,.alt .k{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.alt{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:14px}
.alt strong{font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--raised);border-radius:12px;padding:10px}
.tile .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .u{font-size:12px;color:var(--muted)}

/* Descanso */
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.box ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}

/* Botones */
.btn{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:12px 16px;font-size:15px}
.btn.ghost{background:var(--raised);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.row .field{flex:1 1 90px}

/* Progreso */
.weekdots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.wd .d{font-family:var(--display);font-weight:700;font-size:18px}
.wd .s{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wd.done{background:var(--good);border-color:var(--good);color:#fff}
.wd.done .s{color:#fff}
.wd.next{border-color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--accent)}
.chart text{fill:var(--muted);font-family:var(--body);font-size:10px;font-variant-numeric:tabular-nums}
.lift{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lift:first-child{border-top:0}
.lift .nm{font-weight:600;font-size:15px}
.lift .nums{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.delta{font-weight:700}
.delta.up{color:var(--good)}
.spark{width:92px;height:30px}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent)}
.empty{color:var(--muted);font-size:14.5px}

/* Comida */
.ringwrap{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{width:132px;height:132px}
.ring .bgc{fill:none;stroke:var(--raised);stroke-width:12}
.ring .fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .4s ease}
.ring .fg.hit{stroke:var(--good)}
.ring .big{font-family:var(--display);font-weight:800;font-size:38px;fill:var(--ink)}
.ring .small{font-family:var(--body);font-size:11px;fill:var(--muted);font-weight:600}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600;line-height:1.2}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.chip b{font-family:var(--display);font-size:20px;color:var(--accent);white-space:nowrap}
.items{display:flex;flex-wrap:wrap;gap:6px}
.item{background:var(--raised);border:0;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600}
.item span{color:var(--muted);margin-left:4px}
.habit{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;font-size:15px;font-weight:600}
.habit small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.habit .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.habit[aria-pressed="true"]{border-color:var(--good)}
.habit[aria-pressed="true"] .bx{background:var(--good);border-color:var(--good);color:#fff}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px;position:relative}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bar i{width:100%;border-radius:6px 6px 2px 2px;background:var(--raised);min-height:3px}
.bar.hit i{background:var(--good)}
.bar.part i{background:var(--accent)}
.bar span{font-size:11px;color:var(--muted);font-weight:600}
.bar em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}

/* Guía */
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em}
details ul{margin:10px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px}
details p{margin:10px 0 0;font-size:15px}
.seg{display:inline-flex;background:var(--raised);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:8px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.stepper{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.stepper button{width:38px;height:38px;border-radius:10px;border:0;background:var(--raised);font-size:20px;font-weight:700;font-family:var(--body)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sync.cloud i{background:var(--good)}

/* Cronómetro de descanso */
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:0 12px 8px;z-index:5;pointer-events:none}
.timer[hidden]{display:none}
.tin{pointer-events:auto;max-width:496px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);position:relative;overflow:hidden}
.tin .lab{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.tin .clock{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.tin button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;background:rgba(127,127,127,.28);color:inherit}
.tin .prog{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:100%;transform-origin:left;transition:transform .25s linear}
.tin.end{background:var(--good);color:#fff}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:none;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);border-radius:10px}
.tab svg{width:24px;height:24px}
.tab[aria-pressed="true"]{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* v3: botones grandes, fases, técnica, porciones */
.set{grid-template-columns:22px 1fr 1fr 60px;gap:8px}
.set.one{grid-template-columns:22px 1fr 60px}
.set.three{grid-template-columns:1fr 1fr 1fr 60px}
.ok{width:60px;height:54px;border-radius:14px}
.ok svg{width:26px;height:26px}
.field input{font-size:20px;padding:13px 10px;height:54px}
.set.last .field:last-of-type span{color:var(--accent)}
.count svg{width:18px;height:18px}
.chead{padding:16px 14px;min-height:76px}
.badge.plus{background:var(--accent);color:var(--accent-ink)}
.badge.barra{background:var(--ink);color:var(--bg)}
.phase{border-left:4px solid var(--accent);background:var(--surface);border-radius:0 12px 12px 0;padding:10px 14px;font-size:14.5px}
.phase b{display:block;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1;margin-bottom:2px}
.plan .ef{font-size:13px;color:var(--muted);margin-top:2px}
.tech{display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.tech .k,.k2{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tech .k.bad{color:var(--warn)}
.tech .k.cue{color:var(--accent)}
.k2{margin-top:10px}
.due{font-size:14px;font-weight:700;color:var(--accent)}
.btn{min-height:54px}
.btn.big{font-size:18px;min-height:60px}
.grow{flex:1}
.prow{display:flex;gap:10px;margin-top:14px}
.prow .ghost{width:72px;font-size:26px}
.pcount{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:600}
.pcount .big{font-family:var(--display);font-weight:800;font-size:76px;line-height:.9;font-variant-numeric:tabular-nums}
.pcount .big.hit{color:var(--good)}
.pips{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.pips i{flex:1 1 30px;height:14px;border-radius:7px;background:var(--raised)}
.pips i.on{background:var(--accent)}
.pips i.goal{box-shadow:inset -3px 0 0 var(--ink)}
ul.two{columns:2;column-gap:20px;margin:0;padding-left:18px;font-size:14.5px;display:block}
ul.two li{margin-bottom:6px;break-inside:avoid}
.habit{min-height:64px}
.lifts{padding:4px 16px}
details.lift{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:0;display:block}
details.lift:first-child{border-top:0}
details.lift summary{font-family:var(--body);font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;list-style:none;min-height:60px}
details.lift summary::-webkit-details-marker{display:none}
.lift .nm,.lift .nums{display:block}
ul.hist{list-style:none;margin:0 0 12px;padding:0;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
ul.hist li{display:grid;grid-template-columns:62px 1fr;gap:8px}
ul.hist b{color:var(--muted);font-weight:600}
.tab{min-height:54px}
.tin button{min-height:48px;padding:10px 14px}
.setting .sync{align-items:flex-start}
.setting .sync i{flex:none;margin-top:6px}

/* app instalada: safe areas y tacto */
html{background:var(--bg)}
body{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
.app{padding-top:calc(14px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));padding-bottom:calc(190px + env(safe-area-inset-bottom))}
button,summary,.lab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.setting.col{flex-direction:column;align-items:stretch}
.setting .prow{margin-top:4px}
.lab{display:grid;place-items:center;cursor:pointer}

/* v4: pulido de interfaz */
html{min-height:calc(100% + env(safe-area-inset-top))}
.scrim{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:7}
button{transition:transform .08s ease,background-color .15s ease,border-color .15s ease}
button:active{transform:scale(.96)}
.app{gap:14px}
h1{font-size:44px}
.sub{margin-top:6px}
.week{gap:5px}
.day{position:relative;padding:10px 0 8px;border-radius:14px}
.day .d{font-size:24px}
.day .t{font-size:8.5px;letter-spacing:0;white-space:nowrap}
.day.off{background:transparent;border-style:dashed}
.day.off .d{color:var(--muted)}
.day.today{border-color:var(--accent)}
.day.did::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--good)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);border-style:solid}
.day[aria-pressed="true"] .d{color:var(--bg)}
.segs i{height:5px}
.brief{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.brief>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.brief b{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.brief span{font-size:13.5px;line-height:1.3}
.donecard{background:var(--good);color:#06130c;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.donecard b{font-family:var(--display);font-size:30px;line-height:1;text-transform:uppercase}
.donecard span{font-size:14.5px}
.donecard .btn{background:#06130c;color:#fff;margin-top:6px}
.card{border-radius:18px;transition:border-color .15s ease}
.card.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.done:not(.open){opacity:.72}
.card.done.open{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.cname{font-size:23px}
.lastw{color:var(--ink);font-weight:700}
.count{min-width:48px;height:48px;border-radius:24px}
.plan{background:transparent;border:1px solid var(--line);padding:12px}
.plan .go{font-size:15.5px}
.cbody details.techd{background:var(--raised);border:0;border-radius:12px;padding:0 12px}
.cbody details.techd summary{font-family:var(--body);font-size:14px;font-weight:700;text-transform:none;letter-spacing:0;min-height:48px}
.cbody details.techd .tech{padding-bottom:12px}
details{border-radius:16px;padding:0 14px}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:56px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--body);font-weight:500;font-size:22px;color:var(--muted)}
details[open]>summary::after{content:"\2013"}
details>ul,details>p{margin:0 0 14px}
details.lift summary::after{content:none}
details.lift{padding:0}
.wd{font:inherit;color:inherit;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px}
.wd .s{font-size:9.5px}
.wd.next{box-shadow:0 0 0 1px var(--accent)}
.bkrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.bkrow .btn{font-size:15px;padding:12px 8px;min-height:52px}
.box{border-radius:18px}
.tabs{padding:4px 8px max(6px, calc(env(safe-area-inset-bottom) - 12px));background:color-mix(in srgb, var(--surface) 88%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tab{min-height:50px;gap:2px}
.tab svg{width:25px;height:25px}
.timer{bottom:calc(60px + max(6px, calc(env(safe-area-inset-bottom) - 12px)))}
.tin{border-radius:20px;padding:14px 16px}
.tin .clock{font-size:46px}
.app{padding-bottom:calc(200px + env(safe-area-inset-bottom))}

.see{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.musc{font-size:14.5px;font-weight:600;line-height:1.25}
.musc .k{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.seebtn{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 14px;border-radius:12px;background:var(--raised);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none}
.seebtn svg{width:18px;height:18px;color:var(--accent)}
.seebtn:active{transform:scale(.96)}

</style>

/* ---------- Fecha: el día de gym cambia a las 4 am ---------- */
function pad(n){ return (n<10?"0":"")+n; }
function dkey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
var NOW = new Date(Date.now() - 4*3600*1000), TODAY = dkey(NOW), todayKey = NOW.getDay();
var PHASE2 = TODAY >= "2026-11-16";
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function dlabel(k){ var q = k.split("-"); return (+q[2])+" "+MESES[(+q[1])-1]; }
function daysSince(k){ var q = k.split("-"), a = new Date(+q[0], +q[1]-1, +q[2]), b = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate()); return Math.round((b-a)/86400000); }

/* ---------- Plan del día, con la fase aplicada ---------- */
function byKey(k){ for(var i=0;i<DAYS.length;i++) if(DAYS[i].key===k) return DAYS[i]; }
function plan(k){
  var d = byKey(k); if(d.rest) return [];
  var elig = 0;
  return d.ex.map(function(x){
    var ex = EX[x.id], sets = x.sets, plus = false, strength = ex.eq!=="cardio" && !x.act && !ex.time;
    if(strength && !d.light){ if(elig < 2 && PHASE2){ sets++; plus = true; } elig++; }
    var rest = ex.eq==="cardio" ? 0 : (x.rest || ((d.legs || ex.heavy) ? 120 : 90));
    return { id:x.id, ex:ex, sets:sets, reps:x.reps, rest:rest, act:!!x.act, plus:plus, light:!!d.light };
  });
}

function normalize(s){
  var b = blank(); s = s && typeof s==="object" ? s : {};

  b.log = s.log && typeof s.log==="object" ? s.log : {};
  b.body = Array.isArray(s.body) ? s.body : [];
  b.food = s.food && typeof s.food==="object" ? s.food : {};
  b.bk = typeof s.bk==="string" ? s.bk : "";
  return b;
}

function openDB(){
  if(DBP) return DBP;
  DBP = new Promise(function(res, rej){
    try{
      var r = indexedDB.open("rutina", 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    }catch(e){ rej(e); }
  });
  return DBP;
}
function saveIDB(){ openDB().then(function(db){ db.transaction("kv","readwrite").objectStore("kv").put(JSON.parse(JSON.stringify(state)), "state"); }).catch(function(){}); }
function loadIDB(){ return openDB().then(function(db){ return new Promise(function(res){ var q = db.transaction("kv").objectStore("kv").get("state"); q.onsuccess = function(){ res(q.result); }; q.onerror = function(){ res(null); }; }); }).catch(function(){ return null; }); }
function prune(){
  Object.keys(state.log).forEach(function(k){ var a=state.log[k]; if(a.length>80) state.log[k]=a.slice(a.length-80); });
  var keys = Object.keys(state.food).sort(); while(keys.length>200){ delete state.food[keys.shift()]; }
  if(state.body.length>300) state.body = state.body.slice(state.body.length-300);
}
function persist(){ state.t = Date.now(); prune(); saveLocal(); saveIDB(); }
function syncText(){ return sync==="cloud" ? "Datos guardados en este iPhone, con almacenamiento protegido" : "Datos guardados en este iPhone"; }
function setSync(s){ sync = s; var el=document.getElementById("syncline"); if(el){ el.className="sync "+(s==="cloud"?"cloud":""); el.lastChild.textContent = syncText(); } }
function hasData(){ return Object.keys(state.log).length || state.body.length || Object.keys(state.food).length; }
function backupText(){ if(!hasData()) return "Todavía no hay nada que respaldar."; if(!state.bk) return "Nunca has hecho un respaldo."; var n = daysSince(state.bk); return "Último respaldo: "+(n<=0?"hoy":"hace "+n+" día"+(n===1?"":"s"))+"."; }
function exportData(){
  var txt = JSON.stringify(state), name = "rutina-respaldo-"+TODAY+".json", file = null;
  function done(){ state.bk = TODAY; persist(); render(); }
  try{ file = new File([txt], name, { type:"application/json" }); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({ files:[file] })){ navigator.share({ files:[file], title:"Respaldo de rutina" }).then(done, function(){}); return; }
  try{ var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type:"application/json" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); done(); }catch(e){}
}
function importData(file){
  var fr = new FileReader();
  fr.onload = function(){
    var msg = document.getElementById("bkmsg");
    try{ var o = JSON.parse(fr.result); if(!o || typeof o.log!=="object") throw 0; state = normalize(o); persist(); openEx = firstOpen(); render(); msg = document.getElementById("bkmsg"); if(msg) msg.textContent = "Respaldo restaurado."; }
    catch(e){ if(msg) msg.textContent = "Ese archivo no es un respaldo de esta app."; }
  };
  fr.readAsText(file);
}
function initRemote(){
  loadIDB().then(function(saved){
    if(saved && typeof saved==="object"){ var r = normalize(saved); if(r.t > state.t){ state = r; saveLocal(); openEx = firstOpen(); render(); } else if(state.t > r.t) saveIDB(); }
    else if(state.t) saveIDB();
  });
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function(ok){ if(ok) setSync("cloud"); }, function(){}); }catch(e){}
  try{ if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
}

/* ---------- Pantalla encendida ---------- */
var wake = null, wakeState = "off";
function wakeText(){ return wakeState==="on" ? "Pantalla encendida mientras entrenas: activa" : wakeState==="no" ? "Pantalla encendida: este iPhone no lo permite. Sube el bloqueo automático en Ajustes del teléfono" : "Pantalla encendida: se activa al marcar tu primera serie"; }
function updWake(){ var el=document.getElementById("wakeline"); if(el){ el.className="sync "+(wakeState==="on"?"cloud":""); el.lastChild.textContent = wakeText(); } }
function askWake(){
  if(wake || wakeState==="no") return;
  if(!navigator.wakeLock || !navigator.wakeLock.request){ wakeState = "no"; updWake(); return; }
  try{
    navigator.wakeLock.request("screen").then(function(l){
      wake = l; wakeState = "on"; updWake();
      l.addEventListener("release", function(){ wake = null; if(wakeState==="on") wakeState = "off"; updWake(); });
    }, function(){ wakeState = "no"; updWake(); });
  }catch(e){ wakeState = "no"; updWake(); }
}
var wantWake = false;
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible" && wantWake) askWake(); });

/* ---------- Utilidades de registro ---------- */
function num(v){ var n = parseFloat(String(v==null?"":v).replace(",", ".")); return isFinite(n) ? n : null; }
function fmt(n){ return n==null ? "" : String(Math.round(n*10)/10); }
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+pad(s%60); }
function entries(id){ return state.log[id] || (state.log[id]=[]); }
function real(e){ return e ? e.sets.filter(function(s){ return !!s; }) : []; }
function todayEntry(id, create){
  var a = state.log[id] || []; for(var i=a.length-1;i>=0;i--) if(a[i].d===TODAY) return a[i];
  if(!create) return null; var e={ d:TODAY, sets:[] }; entries(id).push(e); return e;
}
function prevEntry(id){ var a = state.log[id]||[]; for(var i=a.length-1;i>=0;i--){ if(a[i].d!==TODAY && real(a[i]).length) return a[i]; } return null; }
function doneSets(id){ return real(todayEntry(id)).length; }
function isDone(p){ return doneSets(p.id) >= p.sets; }
function best(e, ex){ var r=real(e); if(!r.length) return null; var f = ex.eq==="cardio" ? "m" : (ex.time ? "r" : "w"); return Math.max.apply(null, r.map(function(s){ return s[f]||0; })); }
function unitOf(ex){ return state.unit + (ex.side ? " por lado" : ""); }
function describe(e, ex){
  var r = real(e); if(!r.length) return "";
  if(ex.eq==="cardio"){ var c=r[0]; return fmt(c.m)+" min · inclinación "+fmt(c.i)+" · velocidad "+fmt(c.v); }
  if(ex.time) return r.map(function(s){ return fmt(s.r)+" s"; }).join(" · ");
  return r.map(function(s){ return fmt(s.w)+" × "+fmt(s.r); }).join(" · ")+" "+unitOf(ex);
}
function suggest(p, prev){
  var ex = p.ex, r = real(prev);
  if(ex.eq==="cardio"){
    if(!r.length) return { cls:"", t:"Inclinación "+ex.ci+", velocidad "+ex.cv+", "+ex.range+" minutos." };
    return { cls:"hold", t:"Igual o un poco más que la vez pasada, dentro de "+ex.range+" minutos." };
  }
  if(p.act) return { cls:"", t:"Liviano. No es para cansarte: es para despertar la espalda antes del jalón." };
  if(!r.length){
    if(ex.time) return { cls:"", t:"Aguanta "+p.reps+" segundos con buena forma." };
    return { cls:"", t: ex.start ? "Peso de partida: "+fmt(ex.start)+" "+unitOf(ex)+". Busca "+p.sets+" × "+p.reps+"." : "Primera vez: elige un peso con el que salgan "+p.reps+" repeticiones limpias y anótalo." };
  }
  var full = r.length >= p.sets, minR = Math.min.apply(null, r.map(function(s){ return s.r||0; }));
  if(ex.time){
    if(full && minR >= p.reps) return { cls:"up", t:"Completaste todo. Suma 5 segundos por serie." };
    return { cls:"hold", t:"Repite hasta aguantar "+p.reps+" s en todas las series." };
  }
  var w = Math.max.apply(null, r.map(function(s){ return s.w||0; }));
  if(full && minR >= p.reps){
    if(ex.eq==="manc"){ var inc = state.unit==="kg" ? 2 : 5; return { cls:"up", t:"Completaste todas las series y repeticiones con "+fmt(w)+". Hoy sube a "+fmt(w+inc)+" "+state.unit+"." }; }
    return { cls:"up", t:"Completaste todas las series y repeticiones con "+fmt(w)+" "+unitOf(ex)+". Hoy sube al siguiente peso." };
  }
  return { cls:"hold", t:"Repite "+fmt(w)+" "+unitOf(ex)+" hasta completar "+p.sets+" × "+p.reps+". Ahí subes." };
}
function effort(p, i){
  if(p.ex.eq==="cardio" || p.ex.time || p.act) return "";
  if(p.light) return "Día ligero: deja 3 repeticiones en el tanque.";
  if(!PHASE2) return "Fase 1: deja 2 a 3 repeticiones en el tanque en todas las series.";
  return "Fase 2: la última serie va a 1 repetición del fallo. Las demás, con 2 en el tanque."+(p.plus ? " Este ejercicio lleva 1 serie extra." : "");
}

function card(p, n){

/* ---------- Vista: Progreso ---------- */
function spark(vals){
  var w=92, h=30, p=4; if(!vals.length) return "";

  var pts = vals.map(function(v,i){ var x = vals.length===1 ? w-p : p + i*(w-2*p)/(vals.length-1); var y = mx===mn ? h/2 : h-p - (v-mn)/span*(h-2*p); return [x,y]; });
  var last = pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+(pts.length>1?'<polyline points="'+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" ")+'"/>':"")+'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.2"/></svg>';
}
function lineChart(pts, f, label){
  pts = pts.filter(function(x){ return x[f]; }).slice(-26); if(pts.length<2) return "";

  var mn=Math.floor(Math.min.apply(null,vals)-1), mx=Math.ceil(Math.max.apply(null,vals)+1), span=mx-mn;
  function X(i){ return l + i*(W-l-r)/(pts.length-1); } function Y(v){ return t + (mx-v)/span*(H-t-b); }
  var line = pts.map(function(p,i){ return X(i).toFixed(1)+","+Y(p[f]).toFixed(1); }).join(" "), g="";
  [mx,(mn+mx)/2,mn].forEach(function(v){ g += '<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(l-5)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+fmt(v)+'</text>'; });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+'">'+g
    +'<polygon class="ar" points="'+X(0)+","+(H-b)+" "+line+" "+X(pts.length-1)+","+(H-b)+'"/><polyline class="ln" points="'+line+'"/>'
    +pts.map(function(p,i){ return '<circle class="pt" r="'+(i===pts.length-1?4:2.5)+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p[f]).toFixed(1)+'"/>'; }).join("")
    +'<text x="'+l+'" y="'+(H-6)+'">'+dlabel(pts[0].d)+'</text><text x="'+(W-r)+'" y="'+(H-6)+'" text-anchor="end">'+dlabel(pts[pts.length-1].d)+'</text></svg>';
}

  h += '<div class="row" style="margin-top:10px"><label class="field"><span>Peso '+state.unit+'</span><input id="bw" inputmode="decimal" placeholder="'+(last?fmt(last.w):"174")+'"></label><label class="field"><span>Cintura cm</span><input id="bc" inputmode="decimal" placeholder="'+(last&&last.c?fmt(last.c):"cm")+'"></label><button type="button" class="btn" data-act="body">Guardar</button></div></div></section>';

  var rows = "";
  Object.keys(EX).forEach(function(id){
    var ex=EX[id], a=(state.log[id]||[]).filter(function(e){ return real(e).length; }); if(!a.length) return;
    var vals = a.map(function(e){ return best(e, ex); }), f=vals[0], l=vals[vals.length-1], u = ex.eq==="cardio" ? "min" : (ex.time ? "s" : state.unit), dl=l-f;
    rows += '<details class="lift"><summary><span><span class="nm">'+ex.n+'</span><span class="nums">'+(a.length>1 ? fmt(f)+" → "+fmt(l)+" "+u+' · <span class="delta'+(dl>0?" up":"")+'">'+(dl>0?"+":"")+fmt(dl)+'</span>' : fmt(l)+" "+u)+" · "+a.length+(a.length===1?" sesión":" sesiones")+'</span></span>'+spark(vals.slice(-12))+'</summary><ul class="hist">'
      +a.slice(-8).reverse().map(function(e){ return '<li><b>'+dlabel(e.d)+'</b>'+describe(e, ex)+'</li>'; }).join("")+'</ul></details>';
  });
  h += '<section class="sec"><div class="sechead"><h2>Historial de pesos</h2><span class="hint">toca para ver sesiones</span></div><div class="box lifts">'+(rows || '<p class="empty" style="margin:0">Aquí aparece cada ejercicio cuando marques tu primera serie, con el peso de cada sesión.</p>')+'</div></section>';
  return h;
}

/* ---------- Vista: Comida ---------- */
function foodDay(k, create){ var f=state.food[k]; if(!f && create) f = state.food[k] = { n:0, h:[false,false,false] }; if(f){ if(typeof f.n!=="number") f.n = 0; if(!Array.isArray(f.h)) f.h=[false,false,false]; } return f; }
function viewComida(){
  var f = foodDay(TODAY) || { n:0, h:[false,false,false] }, hit = f.n >= PORC_MIN;
  var h = '<header><div class="eyebrow">Comida · hoy</div><h1>Porciones de proteína</h1></header>';
  var pips = ""; for(var i=0;i<Math.max(PORC_MAX, f.n);i++) pips += '<i class="'+(i<f.n?"on":"")+(i===PORC_MIN-1?" goal":"")+'"></i>';
  h += '<div class="box"><div class="pcount"><span class="big'+(hit?" hit":"")+'">'+f.n+'</span><span>de '+PORC_MIN+"–"+PORC_MAX+' porciones<br><span class="hint">'+(hit ? "Meta cumplida." : "Faltan "+(PORC_MIN-f.n)+" para la meta.")+'</span></span></div><div class="pips">'+pips+'</div>'
    +'<div class="prow"><button type="button" class="btn ghost big" data-act="pminus" aria-label="Quitar una porción">−</button><button type="button" class="btn big grow" data-act="pplus">+ 1 porción</button></div></div>';
  h += '<section class="sec"><h2>Qué es 1 porción</h2><div class="box"><ul class="two">'+PORCIONES.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul></div></section>';
  h += '<section class="sec"><h2>Recordatorios de hoy</h2>'+HABITS.map(function(x,i){ return '<button type="button" class="habit" data-act="habit" data-i="'+i+'" aria-pressed="'+!!f.h[i]+'"><span class="bx">'+CHECK+'</span><span>'+x.n+'<small>'+x.s+'</small></span></button>'; }).join("")+'</section>';
  var bars = "", ok = 0;
  for(var j=6;j>=0;j--){ var d=addDays(NOW,-j), fd=foodDay(dkey(d)), n=fd?fd.n:0, good=n>=PORC_MIN; if(good) ok++;
    bars += '<div class="bar'+(good?" hit":(n>0?" part":""))+'"><em>'+(n||"")+'</em><i style="height:'+Math.max(3, Math.min(1, n/PORC_MAX)*70)+'%"></i><span>'+byKey(d.getDay()).short+'</span></div>'; }
  h += '<section class="sec"><div class="sechead"><h2>Últimos 7 días</h2><span class="hint">'+ok+' de 7 con la meta</span></div><div class="box"><div class="bars">'+bars+'</div></div></section>';
  return h;
}

/* ---------- Vista: Guía ---------- */
function viewGuia(){
  var h = '<header><div class="eyebrow">Guía</div><h1>Reglas del juego</h1></header>';
  h += '<details open><summary>Fases</summary><ul><li><b>Fase 1, hasta el 15 de noviembre:</b> todas las series con 2 a 3 repeticiones en el tanque.</li><li><b>Fase 2, desde el 16 de noviembre:</b> 1 serie más en los 2 primeros ejercicios de cada día, y la última serie de cada ejercicio a 1 repetición del fallo.</li><li>La app cambia sola el 16. El viernes se queda igual porque es el día ligero, y en miércoles la activación no cuenta como primer ejercicio.</li></ul></details>';
  h += '<details><summary>Cuándo subir el peso</summary><ul><li>Si completas todas las series y todas las repeticiones, la próxima sesión la app te dice que subas.</li><li>Si te faltó alguna repetición, repites el mismo peso hasta completarlas.</li><li>Subir significa la siguiente placa de la máquina o el siguiente par de mancuernas, lo mínimo posible.</li></ul></details>';
  h += '<details><summary>Descansos y cardio</summary><ul><li><b>Descanso:</b> 1:30 entre series. 2:00 en piernas y en los pesados (jalón al pecho, remo en polea, press de pecho). El cronómetro arranca solo al marcar la serie.</li><li><b>Calentamiento:</b> 5 min de caminadora a 3 % y 5 km/h, y 1 serie ligera del primer ejercicio.</li><li><b>Cardio de los días de pesas:</b> al final, 10 a 15 min, inclinación 5, velocidad 4.5.</li><li><b>Viernes:</b> caminadora inclinada 25 a 30 min, primero.</li></ul></details>';
  h += '<details><summary>Comida</summary><ul><li>5 a 6 porciones de proteína al día.</li><li>Carbohidrato a la mitad en todas las comidas, menos en la de antes de entrenar.</li><li>Cero calorías en bebidas.</li><li>Creatina 3 a 5 g todos los días.</li></ul></details>';
  h += '<section class="sec"><h2>Ajustes</h2><div class="box"><div class="setting"><span>Unidad de peso</span><span class="seg"><button type="button" data-act="unit" data-u="lb" aria-pressed="'+(state.unit==="lb")+'">lb</button><button type="button" data-act="unit" data-u="kg" aria-pressed="'+(state.unit==="kg")+'">kg</button></span></div>'
    +'<div class="setting"><span class="sync '+(sync==="cloud"?"cloud":"")+'" id="syncline"><i></i><span>'+syncText()+'</span></span></div>'
    +'<div class="setting"><span class="sync '+(wakeState==="on"?"cloud":"")+'" id="wakeline"><i></i><span>'+wakeText()+'</span></span></div>'
    +'<div class="setting col"><span><b>Respaldo</b><br><span class="hint" id="bkmsg">'+backupText()+'</span><br><span class="hint">Guárdalo en Archivos o iCloud cada par de semanas. Si borras la app o cambias de teléfono, lo restauras aquí.</span></span><span class="bkrow"><button type="button" class="btn" data-act="export">Guardar respaldo</button><label class="btn ghost lab">Restaurar<input type="file" id="imp" accept=".json,application/json" hidden></label></span></div></div></section>';
  return h;
}

/* ---------- Render y eventos ---------- */
var view = document.getElementById("view");
function render(){
  view.innerHTML = tab==="hoy" ? viewHoy() : tab==="progreso" ? viewProgreso() : tab==="comida" ? viewComida() : viewGuia();
  var tabs = document.querySelectorAll(".tab"); for(var i=0;i<tabs.length;i++) tabs[i].setAttribute("aria-pressed", tabs[i].getAttribute("data-tab")===tab);
}
document.querySelector(".tabs").addEventListener("click", function(e){
  var b = e.target.closest(".tab"); if(!b) return; tab = b.getAttribute("data-tab"); render(); window.scrollTo(0,0);
});
view.addEventListener("input", function(e){
  var k = e.target.getAttribute && e.target.getAttribute("data-draft"); if(!k) return;
  var p = k.split("|"), key = p[0]+"|"+p[1]; (draft[key] = draft[key] || {})[p[2]] = e.target.value;
});
view.addEventListener("change", function(e){ if(e.target && e.target.id==="imp" && e.target.files && e.target.files[0]) importData(e.target.files[0]); });
view.addEventListener("toggle", function(e){ var k = e.target.getAttribute && e.target.getAttribute("data-tech"); if(k) techOpen[k] = e.target.open; }, true);
function val(id, i, f){ var el = document.getElementById("in-"+id+"-"+i+"-"+f); if(!el) return null; var v = num(el.value); return v==null ? num(el.placeholder) : v; }
function fail(id, i, f){ var el = document.getElementById("in-"+id+"-"+i+"-"+f); if(el){ el.focus(); el.style.borderColor = "var(--accent)"; } }
function planItem(id){ var pl = plan(selected); for(var i=0;i<pl.length;i++) if(pl[i].id===id) return pl[i]; return null; }
view.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if(!b) return;
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), i = +b.getAttribute("data-i");
  if(act==="goday"){ tab = "hoy"; selected = +b.getAttribute("data-k"); openEx = firstOpen(); draft = {}; render(); window.scrollTo(0,0); return; }
  if(act==="go"){ tab = b.getAttribute("data-tab"); render(); window.scrollTo(0,0); return; }
  if(act==="day"){ selected = +b.getAttribute("data-k"); openEx = firstOpen(); draft = {}; render(); return; }
  if(act==="open"){ openEx = openEx===id ? null : id; render(); return; }
  if(act==="set"){
    var p = planItem(id); if(!p) return; var ex = p.ex, entry = todayEntry(id, true);
    wantWake = true; askWake();
    if(entry.sets[i]){ entry.sets[i] = null; if(!real(entry).length) state.log[id] = entries(id).filter(function(x){ return x!==entry; }); persist(); render(); return; }
    var s;
    if(ex.eq==="cardio"){ s = { i:val(id,i,"i"), v:val(id,i,"v"), m:val(id,i,"m") }; if(!s.m){ fail(id,i,"m"); return; } }
    else if(ex.time){ s = { r:val(id,i,"r") }; if(!s.r){ fail(id,i,"r"); return; } }
    else { s = { w:val(id,i,"w"), r:val(id,i,"r") }; if(s.w==null){ fail(id,i,"w"); return; } if(!s.r){ fail(id,i,"r"); return; } }
    entry.sets[i] = s; delete draft[id+"|"+i]; persist();
    var finished = isDone(p);
    if(p.rest) startTimer(p.rest, finished ? "Descanso · siguiente ejercicio" : "Descanso");
    if(finished) openEx = firstOpen();
    render(); return;
  }
  if(act==="body"){
    var w = num(document.getElementById("bw").value), c = num(document.getElementById("bc").value);
    if(!w){ document.getElementById("bw").focus(); return; }
    state.body = state.body.filter(function(x){ return x.d!==TODAY; }); state.body.push(c ? { d:TODAY, w:w, c:c } : { d:TODAY, w:w });
    persist(); render(); return;
  }
  if(act==="pplus"){ var f = foodDay(TODAY, true); if(f.n < 12) f.n++; persist(); render(); return; }
  if(act==="pminus"){ var f2 = foodDay(TODAY, true); if(f2.n > 0) f2.n--; persist(); render(); return; }
  if(act==="habit"){ var f4 = foodDay(TODAY, true); f4.h[i] = !f4.h[i]; persist(); render(); return; }
  if(act==="export"){ exportData(); return; }
  if(act==="unit"){ state.unit = b.getAttribute("data-u"); persist(); render(); return; }
});

/* ---------- Cronómetro de descanso ---------- */
var T = { end:0, total:0, tick:null, hide:null }, actx = null, beeps = [];
var tEl = document.getElementById("timer"), tin = document.getElementById("tin"), tclock = document.getElementById("tclock"), tprog = document.getElementById("tprog"), tlab = document.getElementById("tlab");
function cancelBeeps(){ beeps.forEach(function(o){ try{ o.stop(0); o.disconnect(); }catch(e){} }); beeps = []; }
function scheduleBeeps(sec){
  try{
    var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    actx = actx || new AC(); if(actx.state==="suspended") actx.resume();
    cancelBeeps();
    [0,0.28,0.56].forEach(function(o, n){
      var osc = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + sec + o;
      osc.frequency.value = n===2 ? 1175 : 880; g.gain.value = 0.2; osc.connect(g); g.connect(actx.destination);
      osc.start(t); osc.stop(t + (n===2?0.4:0.16)); beeps.push(osc);
    });
  }catch(e){}
}
function startTimer(sec, label){
  clearTimeout(T.hide); clearInterval(T.tick);
  T.total = sec; T.end = Date.now() + sec*1000; tlab.textContent = label || "Descanso"; tin.classList.remove("end"); tEl.hidden = false;
  scheduleBeeps(sec); paint(); T.tick = setInterval(paint, 250);
}
function paint(){
  var left = (T.end - Date.now())/1000;
  if(left <= 0){
    clearInterval(T.tick); tclock.textContent = "0:00"; tprog.style.transform = "scaleX(0)"; tin.classList.add("end"); tlab.textContent = "Dale, siguiente serie";
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
    T.hide = setTimeout(function(){ tEl.hidden = true; }, 8000); return;
  }
  tclock.textContent = mmss(Math.ceil(left)); tprog.style.transform = "scaleX("+Math.max(0, left/T.total).toFixed(3)+")";
}
document.getElementById("tskip").addEventListener("click", function(){ clearInterval(T.tick); clearTimeout(T.hide); cancelBeeps(); tEl.hidden = true; });
document.getElementById("tplus").addEventListener("click", function(){
  var left = Math.max(0, (T.end - Date.now())/1000) + 15; clearTimeout(T.hide); clearInterval(T.tick);
  T.total = Math.max(T.total, left); T.end = Date.now() + left*1000; tin.classList.remove("end"); tlab.textContent = "Descanso";
  scheduleBeeps(left); paint(); T.tick = setInterval(paint, 250);
});

openEx = firstOpen();
render();
initRemote();
})();
</script>
